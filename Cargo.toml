[workspace]
members = [".", "fuser-tests"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Christopher Berner <me@cberner.com>"]
license = "MIT"
repository = "https://github.com/cberner/fuser"

[package]
name = "fuser"
description = "Filesystem in Userspace (FUSE) for Rust"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/fuser"
homepage = "https://github.com/cberner/fuser"
version = "0.19.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
authors.workspace = true
keywords = ["fuse", "filesystem", "system", "bindings"]
categories = ["external-ffi-bindings", "api-bindings", "filesystem", "os::unix-apis"]
build = "build.rs"

[dependencies]
bitflags = "2.13.2"
libc = "0.2.191"
log = "0.4.35"
memchr = "2.8.3"
num_enum = "0.7.6"
page_size = "0.6.0"
parking_lot = "0.12.5"
ref-cast = "1.0.27"
serde = { version = "1.0.229", features = ["std", "derive"], optional = true }
smallvec = "1.16.6"
async-trait = { version = "0.1.92", optional = true }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread"], optional = true }
zerocopy = { version = "0.8.64", features = ["derive"] }
nix = { version = "0.32.0", features = ["fs", "user", "poll", "socket", "uio", "mount", "process", "ioctl"] }

[dev-dependencies]
env_logger = "0.11.12"
clap = { version = "4.6.9", features = ["cargo", "derive"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["std", "derive"] }
tempfile = "3.27.0"
nix = { version = "0.32.0", features = ["poll", "fs", "ioctl"] }

[build-dependencies]
pkg-config = "0.3.34"

[features]
default = []
experimental = ["async-trait", "tokio"]
libfuse = []
libfuse2 = ["libfuse"]
libfuse3 = ["libfuse"]
serializable = ["serde"]
# Disable mount implementations. Code will compile but won't work.
# Can be used like this on Linux to check macOS code compiles:
# cargo check --target x86_64-apple-darwin --features=macos-no-mount
macos-no-mount = []

[[example]]
name = "async_hello"
required-features = ["experimental"]

[[example]]
name = "poll"

[[example]]
name = "poll_client"

[[example]]
name = "notify_inval_entry"

[[example]]
name = "notify_inval_inode"

[[example]]
name = "ioctl"

[[example]]
name = "passthrough"

[[example]]
name = "passthrough_fork"
